name: Crear ZIP GLYSTV PRO

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  crear-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar ZIP
        run: |
          git archive \
            --format=zip \
            --prefix=GLYSTV-PRO-fusion/ \
            HEAD \
            -o GLYSTV-PRO-fusion.zip

      - name: Publicar ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GLYSTV-PRO-fusion
          path: GLYSTV-PRO-fusion.zip
          retention-days: 30
          
