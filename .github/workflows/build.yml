name: Build ULTRA4K Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build ULTRA4K APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK 36: lo necesita MPV (si falla, la compilación sigue sin MPV)
      - name: Instalar Android SDK 36
        continue-on-error: true
        run: |
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          if [ ! -x "$SDKM" ]; then SDKM="$(find "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android -name sdkmanager -type f 2>/dev/null | head -1)"; fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install

      # Llave de firma FIJA: necesaria para que las actualizaciones automáticas se puedan instalar encima.
      # Secrets del repositorio: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Preparar llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Sin llave fija NO se compila: un APK con llave distinta rompe las actualizaciones
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Faltan secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ultra4k.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/ultra4k.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # Reintenta hasta 3 veces: Maven/Google a veces responden 429 (demasiadas peticiones) y es temporal
        run: |
          ok=0
          for i in 1 2 3; do
            if bash build-glystv-v3.sh; then ok=1; break; fi
            echo "::warning::Intento $i falló, reintentando en 90 s..."
            sleep 90
          done
          [ "$ok" = 1 ]

      - name: Save APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ULTRA4K-apk
          path: dist/ULTRA4K.apk

      - name: Verificar firma del APK
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs dist/ULTRA4K.apk | grep -i "SHA-256"

      # El tag apk-<número> es el que la app compara con su propia versión para avisar de actualizaciones.
      - name: Upload APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: ULTRA4K APK ${{ github.run_number }}
          files: dist/ULTRA4K.apk
          make_latest: true

          
